    <script>
        (function() {
            const path = window.location.pathname;
            const isLangDir = /^\/(es|zh|ja|de)(\/|$)/.test(path);
            if (!isLangDir) {
                const preferred = localStorage.getItem('preferred_lang');
                if (preferred && preferred !== 'en') {
                    const search = window.location.search;
                    let newPath = path;
                    if (newPath === '/') newPath = '/' + preferred + '/';
                    else newPath = '/' + preferred + newPath;
                    window.location.replace(newPath + search);
                }
            }
        })();
    </script>

    <script>
        // DİL SEÇİMİNİ OXUYURUQ VƏ SUPABASE-DƏN O DİLDƏ DATA ÇƏKİRİK
        let currentLang = 'en';
        const path_for_lang = window.location.pathname;
        const lang_match = path_for_lang.match(/^\/(es|zh|ja|de)(\/|$)/);
        if (lang_match) {
            currentLang = lang_match[1];
        } else {
            currentLang = localStorage.getItem('preferred_lang') || 'en';
        }
        
        const SUPABASE_BASE_URL = "https://cazynqfzqhgrqxuvdycb.supabase.co"; 
        const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNhenlucWZ6cWhncnF4dXZkeWNiIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjQwNjY3MDIsImV4cCI6MjA3OTY0MjcwMn0.Kk8AztWJCHYM5W6EzVxtp3e1ap4_KryEmgm2DsoWbdI";
        
        const FETCH_URL = `${SUPABASE_BASE_URL}/rest/v1/translations?select=slug,meta_title,meta_description,h1_title,summary,content_markdown,created_at,events(event_name,start_time,event_type,venues(name,city,nearest_station,transfer_details))&language_code=eq.${currentLang}&order=created_at.desc&limit=40`;
        
        const guidesDataPromise = fetch(FETCH_URL, {
            headers: {
                'apikey': SUPABASE_ANON_KEY,
                'Authorization': 'Bearer ' + SUPABASE_ANON_KEY
            }
        }).then(res => {
            if(!res.ok) throw new Error("API Error");
            return res.text();
        });

        // İSTİFADƏÇİ İNTERFEYSİ ÜÇÜN DİNAMİK LÜĞƏT (UI DICTIONARY)
        const UI_STRINGS = {
            en: { all: "All イベント", concerts: "Concerts", sports: "スポーツ", read: "Read Transit Guide", back: "Back to All Guides", dest: "Caltrain Destination:", find: "Find Fast Trains to", notFound: "Guide not found", loadError: "Error loading data." },
            es: { all: "Todos", concerts: "Conciertos", sports: "Deportes", read: "Leer Guía", back: "Volver a las Guías", dest: "Destino Caltrain:", find: "Buscar Trenes a", notFound: "Guía no encontrada", loadError: "Error al cargar datos." },
            zh: { all: "所有活动", concerts: "音乐会", sports: "体育赛事", read: "阅读指南", back: "返回所有指南", dest: "Caltrain 目的地:", find: "查找快车前往", notFound: "未找到指南", loadError: "加载数据错误" },
            ja: { all: "全イベント", concerts: "コンサート", sports: "スポーツ", read: "ガイドを読む", back: "すべてのガイドに戻る", dest: "Caltrainの目的地:", find: "への急行列車を探す", notFound: "ガイドが見つかりません", loadError: "データの読み込みエラー" },
            de: { all: "Alle イベント", concerts: "Konzerte", sports: "Sport", read: "Fahrplan lesen", back: "Zurück", dest: "Caltrain Ziel:", find: "Schnellzüge finden nach", notFound: "Leitfaden nicht gefunden", loadError: "Fehler beim Laden" }
        };
        const langUI = UI_STRINGS[currentLang] || UI_STRINGS['en'];
    </script>

<body class="antialiased pb-10 flex flex-col items-center">

    <!-- Language Switcher -->
    <div class="fixed top-4 right-4 z-50">
        <select id="lang-switcher" onchange="changeLanguage(this.value)" class="glass-input p-1.5 rounded-lg text-xs font-bold text-gray-700 outline-none cursor-pointer bg-white/90 shadow-sm border border-gray-200 hover:border-red-400 transition-colors">
            <option value="en">🇺🇸 EN</option>
            <option value="es">🇪🇸 ES</option>
            <option value="zh">🇨🇳 ZH</option>
            <option value="ja">🇯🇵 JA</option>
            <option value="de">🇩🇪 DE</option>
        </select>
    </div>
    <script>
        function changeLanguage(lang) {
            localStorage.setItem('preferred_lang', lang);
            const path = window.location.pathname;
            const search = window.location.search;
            let newPath = path;
            
            // Remove current language prefix if exists
            newPath = newPath.replace(/^\/(es|zh|ja|de)\//, '/');
            if (newPath === '/es' || newPath === '/zh' || newPath === '/ja' || newPath === '/de') newPath = '/';
            
            if (lang !== 'en') {
                if (newPath === '/') newPath = '/' + lang + '/';
                else newPath = '/' + lang + newPath;
            }
            window.location.href = newPath + search;
        }
        
        document.addEventListener("DOMContentLoaded", () => {
            const path = window.location.pathname;
            let currentLang = 'en';
            const match = path.match(/^\/(es|zh|ja|de)(\/|$)/);
            if (match) currentLang = match[1];
            const select = document.getElementById('lang-switcher');
            if (select) select.value = currentLang;
        });
    </script>
    

    <!-- Language Switcher injected by build_i18n.py -->

    <main class="w-full max-w-[500px] px-4 flex flex-col relative pt-6">
        
        <header class="glass-card mb-6 px-5 py-4 flex items-center justify-between sticky top-4 z-40">
            <a href="?" onclick="navigateRoute('?', event)" class="w-10 h-10 flex items-center justify-center bg-red-50 text-red-600 rounded-xl shadow-sm hover:scale-105 transition-transform">
                <i class="fa-solid fa-train-subway text-xl"></i>
            </a>
            
            <div class="text-center flex-1 px-2">
                <h1 class="text-lg font-extrabold text-[#1f2937] tracking-tight">Caltrain <span class="text-red-600">Event</span> Guides</h1>
            </div>
            
            <button onclick="window.location.reload()" class="w-10 h-10 flex items-center justify-center bg-gray-50 text-gray-600 rounded-xl shadow-sm border border-gray-100 hover:bg-gray-100">
                <i class="fa-solid fa-rotate-right text-sm"></i>
            </button>
        </header>
        
        <div id="filter-section" class="flex gap-2 overflow-x-auto custom-scroll w-full snap-x mb-6 hidden">
            <button onclick="filterGuides('All', event)" class="cat-btn active snap-start shrink-0 bg-white border border-gray-200 text-gray-600 px-5 py-2.5 rounded-full text-xs font-bold flex items-center gap-1.5">
                🔥 <span id="ui-all"></span>
            </button>
            <button onclick="filterGuides('concert', event)" class="cat-btn snap-start shrink-0 bg-white border border-gray-200 text-gray-600 px-5 py-2.5 rounded-full text-xs font-bold flex items-center gap-1.5">
                <i class="fa-solid fa-music text-purple-500"></i> <span id="ui-concerts"></span>
            </button>
            <button onclick="filterGuides('sports', event)" class="cat-btn snap-start shrink-0 bg-white border border-gray-200 text-gray-600 px-5 py-2.5 rounded-full text-xs font-bold flex items-center gap-1.5">
                <i class="fa-solid fa-baseball-bat-ball text-orange-500"></i> <span id="ui-sports"></span>
            </button>
        </div>

        <div id="news-container" class="space-y-4 w-full">
            <div class="glass-card p-6 animate-pulse" id="initial-skeleton">
                <div class="h-4 bg-gray-200 rounded-full w-1/4 mb-4"></div>
                <div class="h-6 bg-gray-200 rounded-lg w-3/4 mb-3"></div>
                <div class="h-10 bg-gray-200 rounded-xl w-full"></div>
            </div>
        </div>

        <div id="loading-indicator" class="w-full py-8 flex justify-center items-center hidden">
            <div class="animate-spin rounded-full h-8 w-8 border-b-2 border-red-600"></div>
        </div>
    </main>

    <script>
        // Dil panelini seçilmiş dilə ayarla və UI mətnlərini yenilə
        // 'lang-switcher' is injected by build_i18n.py, so we wait for it or set it if it's there
        const langSwitcher = document.getElementById('lang-switcher');
        if(langSwitcher) langSwitcher.value = currentLang;
        
        document.getElementById('ui-all').textContent = langUI.all;
        document.getElementById('ui-concerts').textContent = langUI.concerts;
        document.getElementById('ui-sports').textContent = langUI.sports;

        let allGuides = [];
        let currentFilteredGuides = [];
        let currentIndex = 0;
        const ITEMS_PER_PAGE = 10;
        
        const container = document.getElementById('news-container');
        const loader = document.getElementById('loading-indicator');
        const filterSection = document.getElementById('filter-section');

        function escapeHTML(str) {
            if(!str) return "";
            return str.replace(/[&<>'"]/g, tag => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;' }[tag] || tag));
        }

        function formatDate(dateString) {
            if(!dateString) return '';
            return new Date(dateString).to各駅停車eDateString(currentLang, { month: 'short', day: 'numeric', year: 'numeric' });
        }

        function updateDynamicSEO(guide) {
            if(!guide) {
                document.title = "Caltrain Event Guides | Transit to Concerts & スポーツ";
                return;
            }
            document.title = escapeHTML(guide.meta_title);
            document.getElementById('meta-desc').content = escapeHTML(guide.meta_description);
            
            let existingSchema = document.getElementById('structured-data');
            if (existingSchema) existingSchema.remove();
            const jsonLd = {
                "@context": "https://schema.org",
                "@type": "Event",
                "name": guide.events.event_name,
                "startDate": guide.events.start_time,
                "location": { "@type": "Place", "name": guide.events.venues.name }
            };
            const script = document.createElement('script');
            script.id = 'structured-data'; script.type = 'application/ld+json';
            script.text = JSON.stringify(jsonLd);
            document.head.appendChild(script);
        }

        function navigateRoute(url, event) {
            if(event) event.preventDefault();
            if (window.location.protocol === 'file:') {
                window.location.search = url.replace('?', '');
                return;
            }
            try {
                window.history.pushState({}, "", url);
                handleRouting();
            } catch (e) {
                window.location.search = url.replace('?', '');
            }
        }

        window.addEventListener('popstate', handleRouting);

        function handleRouting() {
            const urlParams = new URLSearchParams(window.location.search);
            const slug = urlParams.get('slug');

            if (slug) {
                filterSection.classList.add('hidden');
                renderSingleGuide(slug);
            } else {
                updateDynamicSEO(null); 
                filterSection.classList.remove('hidden');
                filterGuides('All');
            }
            window.scrollTo(0, 0);
        }

        function filterGuides(category, event) {
            if(event) {
                document.querySelectorAll('.cat-btn').forEach(btn => btn.classList.remove('active'));
                event.currentTarget.classList.add('active');
            }
            currentFilteredGuides = (category === 'All') ? allGuides : allGuides.filter(g => g.events.event_type === category);
            container.innerHTML = ''; currentIndex = 0; 
            loadMoreItems(); 
        }

        function loadMoreItems() {
            const urlParams = new URLSearchParams(window.location.search);
            if(urlParams.get('slug') || currentIndex >= currentFilteredGuides.length) {
                loader.classList.add('hidden'); return;
            }

            const nextBatch = currentFilteredGuides.slice(currentIndex, currentIndex + ITEMS_PER_PAGE);
            let html = '';
            nextBatch.forEach(guide => {
                html += `
                <article class="glass-card p-6 transition-transform active:scale-[0.98]">
                    <div class="flex justify-between items-center mb-3">
                        <span class="bg-red-100 text-red-600 text-[10px] font-black uppercase tracking-widest px-2.5 py-1 rounded-full">
                            ${escapeHTML(guide.events.event_type)}
                        </span>
                        <span class="text-xs font-bold text-gray-400">${formatDate(guide.events.start_time)}</span>
                    </div>
                    <h2 class="text-lg font-extrabold text-gray-800 leading-tight mb-2">${escapeHTML(guide.h1_title)}</h2>
                    <p class="text-sm text-gray-500 font-medium line-clamp-2 mb-4">📍 ${escapeHTML(guide.events.venues.name)} — ${escapeHTML(guide.summary)}</p>
                    <a href="?slug=${encodeURIComponent(guide.slug)}" onclick="navigateRoute('?slug=${encodeURIComponent(guide.slug)}', event)" class="block w-full text-center bg-red-600 text-white font-bold text-sm py-3 rounded-xl shadow-lg shadow-red-600/20">
                        ${langUI.read}
                    </a>
                </article>`;
            });
            container.insertAdjacentHTML('beforeend', html);
            currentIndex += ITEMS_PER_PAGE;
            if (currentIndex < currentFilteredGuides.length) loader.classList.remove('hidden');
        }

        function renderSingleGuide(slug) {
            const guide = allGuides.find(g => g.slug === slug);
            if(!guide) {
                container.innerHTML = `<div class="glass-card p-6 text-center"><p class="font-bold mb-4">${langUI.notFound}</p><a href="?" onclick="navigateRoute('?', event)" class="text-red-600 font-bold">${langUI.back}</a></div>`;
                return;
            }
            updateDynamicSEO(guide);
            const venue = guide.events.venues;
            
            container.innerHTML = `
                <article class="glass-card p-6 md:p-8 mb-6">
                    <div class="border-b border-gray-100 pb-5 mb-5">
                        <span class="bg-red-100 text-red-600 text-[10px] font-black uppercase tracking-widest px-2.5 py-1 rounded-full">${escapeHTML(guide.events.event_type)}</span>
                        <h1 class="text-2xl font-extrabold text-gray-900 mt-4 leading-tight">${escapeHTML(guide.h1_title)}</h1>
                        <p class="text-sm font-bold text-gray-400 mt-2">📍 ${escapeHTML(venue.name)} (${escapeHTML(venue.city)}) • ${formatDate(guide.events.start_time)}</p>
                    </div>
                    
                    <!-- CALTRAIN DESTINATION & CALL TO ACTION LINK -->
                    <div class="bg-gradient-to-br from-blue-50 to-white border border-blue-100 rounded-2xl p-5 mb-6 shadow-sm">
                        <h3 class="text-xs font-black text-blue-900 uppercase tracking-tighter mb-1">${langUI.dest}</h3>
                        <p class="text-[13px] text-gray-700 font-medium mb-4 leading-relaxed">
                            Alight at <strong class="text-blue-800">${escapeHTML(venue.nearest_station)}</strong>. ${escapeHTML(venue.transfer_details.description)}
                        </p>
                        <a href="https://www.sf-sanjosetrain.com/" target="_blank" rel="noopener noreferrer" class="inline-flex w-full sm:w-auto items-center justify-center bg-blue-600 hover:bg-blue-700 text-white font-bold text-xs py-3 px-5 rounded-xl transition-transform active:scale-95 shadow-lg shadow-blue-600/20">
                            <i class="fa-solid fa-train-subway mr-2 text-sm"></i> ${langUI.find} ${escapeHTML(venue.nearest_station)}
                        </a>
                    </div>

                    <div class="markdown-body">${marked.parse(guide.content_markdown)}</div>
                    
                    <a href="?" onclick="navigateRoute('?', event)" class="mt-8 block text-center bg-gray-100 text-gray-600 font-bold py-3.5 rounded-xl hover:bg-gray-200 transition-colors border border-gray-200">
                        <i class="fa-solid fa-arrow-left mr-2"></i> ${langUI.back}
                    </a>
                </article>`;
        }

        const scrollObserver = new IntersectionObserver((entries) => {
            if(entries[0].isIntersecting && !new URLSearchParams(window.location.search).get('slug')) loadMoreItems(); 
        }, { threshold: 0.1 });

        guidesDataPromise.then(textData => {
            allGuides = JSON.parse(textData);
            document.getElementById('initial-skeleton').remove();
            handleRouting();
            scrollObserver.observe(loader);
        }).catch(err => {
            container.innerHTML = `<div class="glass-card p-6 text-center text-red-500 font-bold">${langUI.loadError}</div>`;
        });
    </script>
</body>
