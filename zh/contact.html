<!DOCTYPE html>
<html lang="zh" translate="no">
<head>
    <meta name="google" content="notranslate">
    <meta name="robots" content="notranslate">
    <link rel="alternate" hreflang="en" href="https://sf-sanjosetrain.com/" />
    <link rel="alternate" hreflang="es" href="https://sf-sanjosetrain.com/es/" />
    <link rel="alternate" hreflang="zh" href="https://sf-sanjosetrain.com/zh/" />
    <link rel="alternate" hreflang="ja" href="https://sf-sanjosetrain.com/ja/" />
    <link rel="alternate" hreflang="de" href="https://sf-sanjosetrain.com/de/" />
    <script>
        (function() {
            const path = window.location.pathname;
            const isLangDir = /^\/(es|zh|ja|de)(\/|$)/.test(path);
            if (!isLangDir) {
                const preferred = localStorage.getItem('preferred_lang');
                if (preferred && preferred !== 'en') {
                    const search = window.location.search;
                    let newPath = path;
                    if (newPath === '/') newPath = '/' + preferred + '/';
                    else newPath = '/' + preferred + newPath;
                    window.location.replace(newPath + search);
                }
            }
        })();
    </script>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>联系 - Caltrain Live</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Outfit:wght@700&display=swap" rel="stylesheet">
    <style>
        body { background: var(--bg-light); color: var(--bg-dark); }
        @media (prefers-color-scheme: dark) { body { background: var(--bg-dark); color: var(--bg-light); } }
        .content { max-width: 600px; margin: 60px auto; padding: 20px; line-height: 1.6; }
        .btn { display: inline-block; padding: 12px 24px; background: var(--primary); color: white; text-decoration: none; border-radius: 12px; font-weight: 600; margin-top: 20px; }
    </style>
</head>
<body>

    <!-- Language Switcher -->
    <div class="fixed top-4 right-4 z-50">
        <select id="lang-switcher" onchange="changeLanguage(this.value)" class="glass-input p-1.5 rounded-lg text-xs font-bold text-gray-700 outline-none cursor-pointer bg-white/90 shadow-sm border border-gray-200 hover:border-red-400 transition-colors">
            <option value="en">🇺🇸 EN</option>
            <option value="es">🇪🇸 ES</option>
            <option value="zh">🇨🇳 ZH</option>
            <option value="ja">🇯🇵 JA</option>
            <option value="de">🇩🇪 DE</option>
        </select>
    </div>
    <script>
        function changeLanguage(lang) {
            localStorage.setItem('preferred_lang', lang);
            const path = window.location.pathname;
            const search = window.location.search;
            let newPath = path;
            
            // Remove current language prefix if exists
            newPath = newPath.replace(/^\/(es|zh|ja|de)\//, '/');
            if (newPath === '/es' || newPath === '/zh' || newPath === '/ja' || newPath === '/de') newPath = '/';
            
            if (lang !== 'en') {
                if (newPath === '/') newPath = '/' + lang + '/';
                else newPath = '/' + lang + newPath;
            }
            window.location.href = newPath + search;
        }
        
        document.addEventListener("DOMContentLoaded", () => {
            const path = window.location.pathname;
            let currentLang = 'en';
            const match = path.match(/^\/(es|zh|ja|de)(\/|$)/);
            if (match) currentLang = match[1];
            const select = document.getElementById('lang-switcher');
            if (select) select.value = currentLang;
        });
    </script>
    

    <div class="content animate-fade">
        <a href="/index.html" style="color: var(--primary); text-decoration: none; font-weight: 600;">← Back to Board</a>
        <h1>联系 Us</h1>
        <p>Have feedback or spotted a delay not shown on the board? Reach out to our developer team via Telegram.</p>
        <a href="https://t.me/emin249" target="_blank" class="btn">Message on Telegram</a>
    </div>
</body>
